name: Generate Contribution Flight

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"
      timezone: "Europe/Istanbul"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Generate contribution flight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: nurbukeaydin
        run: python scripts/generate_contribution_flight.py

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-flight.svg

          if git diff --cached --quiet; then
            echo "Contribution flight is already up to date."
            exit 0
          fi

          git commit -m "Update contribution flight"
          git push
